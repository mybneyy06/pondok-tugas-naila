
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Cybersecurity Analyzer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: #0b1428;
    }
    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 38px;
      border: 1px solid #263b5e;
      border-radius: 20px;
      background: #14233d;
      box-shadow: 0 20px 60px #050b18;
    }
    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #1d4275;
      font-size: 29px;
      margin-bottom: 25px;
    }
    h1 { margin: 0 0 10px; font-size: 25px; }
    .subtitle {
      color: #9aacc8;
      line-height: 1.6;
      margin-bottom: 28px;
      font-size: 14px;
    }
    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 13px;
      color: #cbd8ec;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #344b70;
      border-radius: 10px;
      outline: none;
      background: #0d1930;
      color: white;
    }
    input:focus { border-color: #398cf5; }
    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2878e8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #398cf5; }
    .message {
      min-height: 20px;
      margin-top: 15px;
      color: #ff9ca8;
      font-size: 13px;
    }
    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #9aacc8;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">🛡️</div>
    <h1>Cybersecurity Analyzer</h1>
    <p class="subtitle">
      Silakan masuk untuk mengakses fitur analisis keamanan aplikasi Android.
    </p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Masukkan username" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Masukkan password" required>

      <button type="submit">Login</button>
      <div class="message" id="message"></div>
    </form>

    <a class="back" href="/">← Kembali ke Dashboard</a>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      document.getElementById('message').textContent =
        'Sistem login belum dihubungkan ke backend.';
    });
  </script>
</body>
</html>
