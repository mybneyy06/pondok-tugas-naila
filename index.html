
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#eaf6ff;
  --card:#fff;
  --blue:#398cf5;
  --dark:#205da8;
  --line:#c8e3ff;
  --soft:#dceeff;
  --ink:#254b76;
  --muted:#7693b2;
  --red:#c43b59;
  --shadow:#c6e0ff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  font-family:Nunito,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 8%,#d5edff 0 80px,transparent 81px),
    radial-gradient(circle at 92% 35%,#d5edff 0 100px,transparent 101px),
    var(--bg);
}
button,input { font:inherit; }
button { cursor:pointer; }
.wrap { max-width:1050px; margin:auto; padding:18px 16px 50px; }
header { text-align:center; padding:15px 0 10px; }
.mascot { font-size:58px; display:inline-block; animation:bob 2.4s infinite; }
@keyframes bob { 50% { transform:translateY(-7px) rotate(4deg); } }
h1 { margin:0; color:var(--dark); font-size:clamp(27px,5vw,40px); font-weight:900; }
header p { color:var(--muted); font-weight:800; margin:6px 0; }
.toolbar { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:20px 0; }
.btn {
  display:inline-block;
  border:0;
  border-radius:15px;
  padding:11px 15px;
  background:var(--soft);
  color:var(--dark);
  font-weight:900;
  box-shadow:0 4px 0 var(--shadow);
  transition:.12s;
  text-decoration:none;
}
.btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--shadow); }
.btn.primary { background:var(--blue); color:white; box-shadow:0 4px 0 #2467c6; }
.crumb {
  background:white; border:2px solid var(--line); border-radius:17px;
  padding:13px 15px; margin:15px 0; font-weight:900;
  overflow-wrap:anywhere;
}
.tools { display:flex; gap:10px; margin:14px 0; }
.search {
  width:100%; padding:12px 15px; border:2px solid var(--line);
  border-radius:15px; background:white; color:var(--ink); outline:none;
}
.search:focus { border-color:var(--blue); }
.grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr));
  gap:23px 16px; margin-top:25px;
}
.folder {
  position:relative; text-align:center; background:var(--card);
  border:3px solid var(--line); border-radius:12px 24px 24px 24px;
  padding:29px 12px 15px; box-shadow:0 7px 0 #d2e7ff;
  min-width:0; transition:.18s;
}
.folder:before {
  content:""; position:absolute; top:-15px; left:-3px;
  width:83px; height:17px; background:white;
  border:3px solid var(--line); border-bottom:0;
  border-radius:12px 12px 0 0;
}
.folder:hover { transform:translateY(-4px); border-color:var(--blue); }
.folder-open { cursor:pointer; }
.pic { display:block; font-size:51px; margin-bottom:8px; }
.folder:hover .pic { animation:wig .4s; }
@keyframes wig { 25% { transform:rotate(-9deg); } 75% { transform:rotate(9deg); } }
.fname { display:block; font-size:15px; font-weight:900; overflow-wrap:anywhere; }
.kind { display:block; color:var(--muted); font-size:12px; font-weight:800; margin-top:4px; }
.item-actions { display:flex; justify-content:center; gap:7px; flex-wrap:wrap; margin-top:12px; }
.mini { border:0; border-radius:10px; padding:7px 9px; background:var(--soft); color:var(--dark); font-weight:900; }
.mini.del { background:#ffe6ec; color:var(--red); }
.filelist { display:grid; gap:10px; margin-top:15px; }
.file {
  display:flex; align-items:center; gap:11px; flex-wrap:wrap;
  background:white; border:2px solid var(--line); border-radius:17px; padding:12px;
}
.fileicon { font-size:29px; }
.filemid { flex:1; min-width:100px; }
.filename { display:block; color:var(--dark); font-weight:900; overflow-wrap:anywhere; text-decoration:none; }
.filename:hover { text-decoration:underline; }
.meta { display:block; color:var(--muted); font-size:12px; font-weight:800; margin-top:3px; }
.fileactions { display:flex; gap:6px; flex-wrap:wrap; }
.drop {
  border:3px dashed var(--blue); background:#f5fbff; border-radius:22px;
  padding:20px; text-align:center; margin:18px 0; font-weight:900; cursor:pointer;
}
.drop.over { background:#d5ebff; }
.drop span { display:block; font-size:34px; }
.status { text-align:center; font-weight:800; color:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; margin:14px 0; }
.status.err { color:var(--red); }
.empty { text-align:center; padding:30px 10px; color:var(--muted); font-weight:900; }
.note { font-size:12px; color:var(--muted); text-align:center; margin-top:25px; }
#picker { display:none; }
@media(max-width:500px) {
  .wrap { padding:12px 12px 35px; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 12px; }
  .folder { padding:27px 8px 13px; }
  .pic { font-size:43px; }
  .fileactions { width:100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="mascot">🐧</span>
    <h1>Pondok Tugas Naila ☁️</h1>
    <p>Tempat tugas-tugas kecil yang menggemaskan 🫧</p>
  </header>

  <div class="toolbar">
    <button class="btn" id="backBtn">⬅️ Kembali</button>

    <!-- Tombol menuju aplikasi To-Do List -->
    <a class="btn" href="/lpk-3a/">📝 To-Do List</a>

    <button class="btn primary" id="addFolder">➕ Folder baru</button>
    <button class="btn primary" id="uploadTop">⬆️ Upload tugas</button>
    <button class="btn" id="refresh">🔄 Muat ulang</button>
  </div>

  <div class="crumb" id="crumb">🏠 Menghubungkan ke Drive...</div>

  <div class="tools">
    <input id="search" class="search" placeholder="🔎 Cari folder atau file...">
  </div>

  <div class="drop" id="drop">
    <span>☁️📚</span>
    Tarik file ke sini atau klik untuk memilih tugas
    <small style="display:block;margin-top:5px">Maksimal 3 MB per file</small>
    <input type="file" id="picker" multiple>
  </div>

  <div class="status" id="status">Memuat Google Drive... 🫧</div>
  <div class="grid" id="folders"></div>
  <div class="filelist" id="files"></div>

  <p class="note">💙 Tugas disimpan langsung ke Google Drive.</p>
</div>

<script>
const ROOT = '1oS3fePZH6puYHxC_k63T_sEOGZkkp6dN';
const ANIMALS = ['🐳','🐙','🐬','🐧','🦭','🐟','🐋','🐠','🦀','🐢','🦦','🪼'];
const $ = id => document.getElementById(id);

let current = ROOT;
let stack = [{id:ROOT,name:'Pondok Tugas Naila'}];
let contents = null;
let busy = false;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}

function animal(s) {
  let n = 0;
  for (let i=0; i<s.length; i++) n += s.charCodeAt(i)*(i+1);
  return ANIMALS[n % ANIMALS.length];
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(2) + ' MB';
}

function say(message, error=false) {
  $('status').textContent = message;
  $('status').className = 'status' + (error ? ' err' : '');
}

function showError(e) {
  say('Gagal: ' + (e && e.message ? e.message : String(e)), true);
}

async function apiCall(action, fields = {}) {
  const response = await fetch('/api/drive', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...fields })
  });

  let result;
  try {
    result = await response.json();
  } catch {
    throw new Error('Balasan server tidak valid. Periksa konfigurasi API Vercel.');
  }

  if (!response.ok || !result || result.ok === false) {
    throw new Error((result && result.error) || ('Permintaan gagal (' + response.status + ').'));
  }

  return Object.prototype.hasOwnProperty.call(result, 'data') ? result.data : result;
}

function invoke(fn, args, success) {
  if (busy) {
    say('Tunggu proses sebelumnya selesai ya 🐧');
    return;
  }

  const actions = {
    getContents: () => apiCall('getContents', { folderId: args[0] }),
    createFolder: () => apiCall('createFolder', { parentId: args[0], name: args[1] }),
    renameItem: () => apiCall('renameItem', { id: args[0], type: args[1], newName: args[2] }),
    trashItem: () => apiCall('trashItem', { id: args[0], type: args[1] })
  };

  if (!actions[fn]) {
    showError(new Error('Aksi tidak dikenal: ' + fn));
    return;
  }

  busy = true;
  actions[fn]()
    .then(result => {
      busy = false;
      success(result);
    })
    .catch(error => {
      busy = false;
      showError(error);
    });
}

function render() {
  if (!contents) return;

  $('crumb').textContent = '🏠 ' + stack.map(x => x.name).join('  ›  ');

  const q = $('search').value.trim().toLowerCase();
  const folders = contents.folders.filter(x => x.name.toLowerCase().includes(q));
  const files = contents.files.filter(x => x.name.toLowerCase().includes(q));

  $('folders').innerHTML = folders.map(f => `
    <div class="folder">
      <div class="folder-open" data-open="${esc(f.id)}" data-name="${esc(f.name)}">
        <span class="pic">${animal(f.name)}</span>
        <span class="fname">${esc(f.name)}</span>
        <span class="kind">📁 Folder Google Drive</span>
      </div>
      <div class="item-actions">
        <button class="mini" data-rename="${esc(f.id)}" data-type="folder" data-name="${esc(f.name)}">✏️ Nama</button>
        <button class="mini del" data-delete="${esc(f.id)}" data-type="folder" data-name="${esc(f.name)}">🗑️ Hapus</button>
      </div>
    </div>
  `).join('');

  $('files').innerHTML = files.map(f => `
    <div class="file">
      <span class="fileicon">${f.mimeType && f.mimeType.includes('pdf') ? '📕' : '📄'}</span>
      <div class="filemid">
        <a class="filename" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
        <span class="meta">${fmtSize(f.size)} · ${new Date(f.date).toLocaleDateString('id-ID')}</span>
      </div>
      <div class="fileactions">
        <button class="mini" data-rename="${esc(f.id)}" data-type="file" data-name="${esc(f.name)}">✏️ Nama</button>
        <button class="mini del" data-delete="${esc(f.id)}" data-type="file" data-name="${esc(f.name)}">🗑️ Hapus</button>
      </div>
    </div>
  `).join('');

  if (!folders.length && !files.length) {
    $('folders').innerHTML = '';
    $('files').innerHTML = '<div class="empty">🪼 Folder ini masih kosong.<br>Buat folder atau upload tugas pertamamu!</div>';
  }
}

function load(id, name, push=true) {
  if (busy) {
    say('Tunggu proses sebelumnya selesai ya 🐧');
    return;
  }

  if (push && id !== current) stack.push({id:id, name:name});
  current = id;
  contents = null;

  $('folders').innerHTML = '';
  $('files').innerHTML = '';
  $('crumb').textContent = '🫧 Membaca Google Drive...';
  say('Sedang memuat isi folder...');

  invoke('getContents', [current], data => {
    contents = data;
    stack[stack.length-1].name = data.name;
    render();
    say('Berhasil terhubung ke Google Drive 💙');
  });
}

function reload() {
  load(current, stack[stack.length-1].name, false);
}

function goBack() {
  if (stack.length <= 1) {
    say('Kamu sudah berada di folder utama 🏠');
    return;
  }

  if (busy) {
    say('Tunggu proses sebelumnya selesai ya 🐧');
    return;
  }

  stack.pop();
  const parent = stack[stack.length-1];
  load(parent.id, parent.name, false);
}

function addFolder() {
  const name = prompt('Masukkan nama folder baru:');
  if (name === null) return;
  if (!name.trim()) {
    say('Nama folder tidak boleh kosong.', true);
    return;
  }

  invoke('createFolder', [current, name], () => {
    say('Folder berhasil dibuat! 📁');
    reload();
  });
}

function rename(id, type, oldName) {
  const name = prompt('Masukkan nama baru:', oldName);
  if (name === null || !name.trim() || name === oldName) return;

  invoke('renameItem', [id, type, name], () => {
    say('Nama berhasil diubah! ✨');
    reload();
  });
}

function removeItem(id, type, name) {
  const kind = type === 'folder' ? 'folder' : 'file';

  if (!confirm('Pindahkan ' + kind + ' "' + name + '" ke Sampah Google Drive?')) return;

  invoke('trashItem', [id, type], () => {
    say(kind + ' berhasil dipindahkan ke Sampah 🗑️');
    reload();
  });
}

async function uploadFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  if (busy) {
    say('Tunggu proses sebelumnya selesai ya 🐧');
    return;
  }

  const target = current;
  let successes = 0;
  const failures = [];

  busy = true;
  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];

      if (file.size > 3 * 1024 * 1024) {
        failures.push(file.name + ' (maksimal 3 MB)');
        continue;
      }

      say('Membaca ' + file.name + ' (' + (i + 1) + '/' + files.length + ')...');

      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result));
          reader.onerror = () => reject(new Error('gagal dibaca'));
          reader.readAsDataURL(file);
        });

        const base64 = dataUrl.split(',')[1];
        if (!base64) throw new Error('data file kosong');

        say('Mengunggah ' + file.name + ' (' + (i + 1) + '/' + files.length + ')...');

        await apiCall('uploadFile', {
          folderId: target,
          name: file.name,
          mimeType: file.type || 'application/octet-stream',
          base64
        });
        successes++;
      } catch (error) {
        failures.push(file.name + ' (' + (error.message || error) + ')');
      }
    }
  } finally {
    busy = false;
  }

  say('Selesai! Berhasil: ' + successes + ', gagal/dilewati: ' + failures.length +
      (failures.length ? '\n' + failures.join('\n') : ''), failures.length > 0);

  if (current === target) reload();
}

$('backBtn').onclick = goBack;
$('addFolder').onclick = addFolder;
$('uploadTop').onclick = () => $('picker').click();
$('refresh').onclick = reload;

$('picker').onchange = e => {
  uploadFiles(e.target.files);
  e.target.value = '';
};

$('search').oninput = () => {
  if (contents) render();
};

$('folders').addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open) {
    load(open.dataset.open, open.dataset.name);
    return;
  }

  const renameButton = e.target.closest('[data-rename]');
  if (renameButton) {
    rename(renameButton.dataset.rename, renameButton.dataset.type, renameButton.dataset.name);
    return;
  }

  const deleteButton = e.target.closest('[data-delete]');
  if (deleteButton) {
    removeItem(deleteButton.dataset.delete, deleteButton.dataset.type, deleteButton.dataset.name);
  }
});

$('files').addEventListener('click', e => {
  const renameButton = e.target.closest('[data-rename]');
  if (renameButton) {
    rename(renameButton.dataset.rename, renameButton.dataset.type, renameButton.dataset.name);
    return;
  }

  const deleteButton = e.target.closest('[data-delete]');
  if (deleteButton) {
    removeItem(deleteButton.dataset.delete, deleteButton.dataset.type, deleteButton.dataset.name);
  }
});

const drop = $('drop');

drop.onclick = () => $('picker').click();

drop.ondragover = e => {
  e.preventDefault();
  drop.classList.add('over');
};

drop.ondragleave = () => drop.classList.remove('over');

drop.ondrop = e => {
  e.preventDefault();
  drop.classList.remove('over');
  uploadFiles(e.dataTransfer.files);
};

// Mulai dari folder utama yang sudah ditentukan.
load(ROOT, 'Pondok Tugas Naila', false);
</script>
</body>
</html>
